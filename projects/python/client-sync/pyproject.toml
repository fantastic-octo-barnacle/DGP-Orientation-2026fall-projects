[project]
name = "rm-client-sync"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1"]

[project.scripts]
rm-client = "text_service.client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyright>=1.1,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/text_service"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["PT"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
