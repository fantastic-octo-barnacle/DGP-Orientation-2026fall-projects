[project]
name = "rm-server-sync"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.scripts]
rm-server = "text_service.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1", "pyright>=1.1,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/text_service"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["PT", "FAST", "ANN0", "ANN2"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
